[package]
name = "mvs-registry"
description = "The registry relays check in to: which relays are up and where, and who may be."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mvs-registry"
path = "src/bin/mvs-registry.rs"

[dependencies]
mvs-release.workspace = true
mvs-protocol.workspace = true
# the per-address connection rate (limits::Buckets), the relay key's file (server::load_key)
mvs-relay.workspace = true
indexmap.workspace = true
serde_json.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
base64.workspace = true
tokio = { workspace = true, features = ["sync", "signal"] }
axum.workspace = true
